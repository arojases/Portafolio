<section class="shell hero" id="home" aria-labelledby="hero-heading">
  <div class="hero-copy">
    <p class="intro">{{ lang.t('greeting') }}</p>
    <h1 id="hero-heading">{{ person.name }}</h1>
    <p class="role">{{ lang.t('role') }}</p>
    <p class="description">{{ lang.t('heroDescription') }}</p>
    <div class="actions hero-actions">
      <a class="button button-primary" routerLink="/" fragment="projects">{{
        lang.t('viewProjects')
      }}</a>
      <app-cv-download />
    </div>
    <div class="socials">
      <a
        class="social-icon"
        [href]="person.github"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub"
        ><app-icon name="github"
      /></a>
      @if (person.linkedin) {
        <a
          class="social-icon"
          [href]="person.linkedin"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="LinkedIn"
          ><app-icon name="linkedin"
        /></a>
      }
    </div>
  </div>
  <div class="portrait">
    @if (person.photo; as photo) {
      <img
        class="portrait-photo"
        [class.portrait-photo--opaque]="!photo.transparent"
        [src]="photo.src"
        [alt]="lang.text(photo.alt)"
        width="460"
        height="460"
        fetchpriority="high"
      />
    } @else {
      <div class="portrait-fallback" aria-hidden="true">AR</div>
    }
  </div>
</section>
