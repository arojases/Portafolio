<section id="hero" data-section class="hero">
  <div class="hero-copy" appScrollReveal="left">
    <p class="eyebrow">Angular + GitHub API</p>
    <h1>{{ getDisplayName() }}</h1>
    <p class="role">{{ i18n.t('hero.role') }}</p>
    <p class="headline">{{ i18n.t('hero.headline') }}</p>
    <p class="summary">{{ getBio() }}</p>
  </div>

  <aside class="hero-card" appScrollReveal="right" [revealDelay]="140">
    <img [src]="user.avatar_url" [alt]="'Avatar de ' + getDisplayName()" loading="lazy" />
    <div class="hero-card__content">
      <p class="hero-card__label">{{ i18n.t('hero.cardLabel') }}</p>
      <h2>{{ getDisplayName() }}</h2>
      <p>{{ user.location || i18n.t('hero.remoteWork') }}</p>
    </div>
  </aside>
</section>
