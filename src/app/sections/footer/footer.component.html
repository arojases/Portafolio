<footer>
  <div class="shell footer-inner">
    <div>
      <a class="footer-brand" routerLink="/" fragment="home"
        >{{ person.name }}<span aria-hidden="true">.</span></a
      >
      <p>{{ lang.t('role') }}</p>
    </div>
    <div class="footer-links">
      <a routerLink="/" fragment="projects">{{ lang.t('projects') }}</a>
      <a routerLink="/" fragment="contact">{{ lang.t('contact') }}</a>
      <a [href]="person.github" target="_blank" rel="noopener noreferrer">GitHub</a>
      @if (person.linkedin) {
        <a [href]="person.linkedin" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      }
    </div>
    <p>© {{ year }} {{ person.name }}</p>
  </div>
</footer>
